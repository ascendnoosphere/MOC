name: Verify Lean progress
on:
  push:
    branches:
      - verify/moc-lean-progress-20261123
permissions:
  contents: read
  actions: read
jobs:
  check-four:
    if: ${{ !startsWith(github.event.head_commit.message, 'Preflight ') && !startsWith(github.event.head_commit.message, 'Audit ') && !startsWith(github.event.head_commit.message, 'Replay ') && (!startsWith(github.event.head_commit.message, 'Only ') || startsWith(github.event.head_commit.message, 'Only four ')) }}
    name: Check ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - group: four-facets
            targets: +MOC.WeightedDiamondLowerFacets
          - group: four-rays-a
            targets: +MOC.WeightedDiamondLowerCut01 +MOC.WeightedDiamondLowerCut02 +MOC.WeightedDiamondLowerCut03 +MOC.WeightedDiamondLowerCut04 +MOC.WeightedDiamondLowerCut05
          - group: four-rays-b
            targets: +MOC.WeightedDiamondLowerCut06 +MOC.WeightedDiamondLowerCut07 +MOC.WeightedDiamondLowerCut08
          - group: four-rays-c
            targets: +MOC.WeightedDiamondLowerCut09 +MOC.WeightedDiamondLowerCut10 +MOC.WeightedDiamondLowerCut11
    env:
      MOC_GROUP: ${{ matrix.group }}
      MOC_TARGETS: ${{ matrix.targets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Compute the source key
        id: sources
        run: python .github/verify/module_objects.py key
      - name: Find an exact prior check
        id: prior
        env:
          SOURCE_KEY: ${{ steps.sources.outputs.key }}
        run: |
          python - <<'PY_KEY'
          import json, os
          from pathlib import Path
          table = json.loads(Path('.github/verify/verified_objects.json').read_text())
          key = os.environ['MOC_GROUP'] + '-' + os.environ['SOURCE_KEY']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('run=' + str(table.get(key, '')), file=output)
          PY_KEY
      - name: Download the exact checked objects
        id: prior_objects
        if: steps.prior.outputs.run != ''
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.prior.outputs.run }}
          name: moc-${{ matrix.group }}
          path: ${{ runner.temp }}/moc-objects
      - name: Restore checked objects
        if: steps.prior_objects.outcome != 'success'
        id: objects
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/moc-objects
          key: checked-moc-v1-${{ matrix.group }}-${{ steps.sources.outputs.key }}
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        if: steps.objects.outputs.cache-hit != 'true' && steps.prior_objects.outcome != 'success'
        with:
          path: Lean/.lake
          key: lake-Linux-X64-86fb0afe31431406bdc5b1691b843128a5731c4792d5e6c1bbcd745af8097b7d-8361d126c6eeed67e13b378298a73d21306d296eec5a0de5c4842e41e0136ed5-6b0f6f5ee8f77f70522ffad3c36cd7419e12eea1
          restore-keys: lake-Linux-X64-86fb0afe31431406bdc5b1691b843128a5731c4792d5e6c1bbcd745af8097b7d-8361d126c6eeed67e13b378298a73d21306d296eec5a0de5c4842e41e0136ed5-
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        if: steps.objects.outputs.cache-hit != 'true' && steps.prior_objects.outcome != 'success'
        with:
          lake-package-directory: Lean
          auto-config: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
          build: ${{ !startsWith(matrix.group, 'five-pair-') && !startsWith(matrix.group, 'five-cut-') }}
          build-args: ${{ matrix.targets }}
      - name: Check each large certificate with one compiler
        if: (startsWith(matrix.group, 'five-pair-') || startsWith(matrix.group, 'five-cut-')) && steps.objects.outputs.cache-hit != 'true' && steps.prior_objects.outcome != 'success'
        env:
          leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee_NUM_THREADS: '1'
        run: |
          cd Lean
          for target in $MOC_TARGETS; do
            /usr/bin/time -f 'Peak resident memory %M KiB' lake build "$target"
          done
      - name: Collect compiled modules and build traces
        if: steps.objects.outputs.cache-hit != 'true' && steps.prior_objects.outcome != 'success'
        run: python .github/verify/module_objects.py archive
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moc-${{ matrix.group }}
          path: ${{ runner.temp }}/moc-objects/*.tgz
          retention-days: 1
          compression-level: 0
