name: Verify Lean progress
on:
  push:
    branches:
      - verify/moc-lean-progress-20261123
permissions:
  contents: read
jobs:
  check-four:
    if: ${{ !startsWith(github.event.head_commit.message, 'Preflight ') && !startsWith(github.event.head_commit.message, 'Audit ') && (!startsWith(github.event.head_commit.message, 'Only ') || startsWith(github.event.head_commit.message, 'Only four ')) }}
    name: Check ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - group: four-facets
            targets: +MOC.WeightedDiamondLowerFacets
          - group: four-rays-a
            targets: +MOC.WeightedDiamondLowerCut01 +MOC.WeightedDiamondLowerCut02 +MOC.WeightedDiamondLowerCut03 +MOC.WeightedDiamondLowerCut04 +MOC.WeightedDiamondLowerCut05
          - group: four-rays-b
            targets: +MOC.WeightedDiamondLowerCut06 +MOC.WeightedDiamondLowerCut07 +MOC.WeightedDiamondLowerCut08
          - group: four-rays-c
            targets: +MOC.WeightedDiamondLowerCut09 +MOC.WeightedDiamondLowerCut10 +MOC.WeightedDiamondLowerCut11
    env:
      MOC_GROUP: ${{ matrix.group }}
      MOC_TARGETS: ${{ matrix.targets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Compute the source key
        id: sources
        run: python .github/verify/module_objects.py key
      - name: Restore checked objects
        id: objects
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/moc-objects
          key: checked-moc-v1-${{ matrix.group }}-${{ steps.sources.outputs.key }}
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        if: steps.objects.outputs.cache-hit != 'true'
        with:
          lake-package-directory: Lean
          auto-config: 'false'
          use-mathlib-cache: 'true'
          build: 'true'
          build-args: ${{ matrix.targets }}
      - name: Collect compiled modules and build traces
        if: steps.objects.outputs.cache-hit != 'true'
        run: python .github/verify/module_objects.py archive
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moc-${{ matrix.group }}
          path: ${{ runner.temp }}/moc-objects/*.tgz
          retention-days: 1
          compression-level: 0
  check-matched:
    if: ${{ !startsWith(github.event.head_commit.message, 'Preflight ') && !startsWith(github.event.head_commit.message, 'Audit ') && (!startsWith(github.event.head_commit.message, 'Only ') || startsWith(github.event.head_commit.message, 'Only matched ')) }}
